schema: spec-anchored

# Project test command. Used by `gate-check --run-tests` to record real evidence.
# Examples: "./gradlew test" (Linux/macOS) · "gradlew.bat test" (Windows) · "npm test" · "pytest -q"
# (Pending: define once tests exist; with Gradle it would be "gradlew.bat test")
# test_command: ""

context: |
  Language: english
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Foco — personal Android app (Kotlin + Jetpack Compose, Material 3), 100% local.
  Build: Android Studio or `gradlew.bat assembleDebug`. See `README.md` and `PLAN.md`.

rules:
  proposal:
    - Declare kind (fix|feature|architecture), targets, tests and deps in .openspec.yaml
    - Short: why and what. The how goes in design.md, only if kind=architecture
  specs:
    - Requirements in SHALL; concrete WHEN/THEN scenarios
    - Each requirement carries a [@test] line with the path of the test that verifies it
  tasks:
    - Verifiable checklist; small tasks, each one completable and likely

# Protected zones: changes touching these globs require explicit human approval
# (`human_approved: true` in the change, set by the human). Visible in BOARD.md.
# Example:
# protected:
#   - glob: "app/src/main/**/storage/**"
#     reason: "persistence — user data"
#   - glob: "**/auth/**"
#     reason: "authentication"
protected: []
