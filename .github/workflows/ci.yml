# CI: the JVM test suite on Linux, for every push to main and every pull request.
#
# Why Linux matters: the DataStore migration tests are excluded on Windows
# (see DECISIONS.md [2026-10-18] datastore-test-on-windows). This runner is the
# place where those two tests actually execute.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned, not ubuntu-latest: the label migrates to Ubuntu 26 on 2026-10-19 and
    # a runner image change should not be what turns the suite red.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The daemon JVM is pinned to 25 by gradle/gradle-daemon-jvm.properties,
      # so provide it here instead of letting Gradle download a toolchain.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # compileSdk = 36 (app/build.gradle.kts). Licenses are accepted by default;
      # any other SDK package the build needs is downloaded by AGP on demand.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew test
